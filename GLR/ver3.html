<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפרויקטים של מאיר</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background-color: #0f172a; color: white; }
        main { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        section { height: 100vh; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        
        .project-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 1.5rem; 
            padding: 2.5rem; 
            text-align: center; 
            max-width: 900px; 
            width: 90%; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            transition: transform 0.5s ease; 
        }
        .project-card:hover { transform: translateY(-5px); }
        
        .iframe-wrapper { 
            width: 100%; 
            height: 350px; 
            border-radius: 1rem; 
            overflow: hidden; 
            margin-bottom: 1.5rem; 
            background-color: #ffffff; 
            border: 1px solid rgba(255,255,255,0.2); 
        }
        .iframe-wrapper iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            pointer-events: none; 
        }
        
        .animate-up { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .is-visible .animate-up { opacity: 1; transform: translateY(0); }
        
        .delay-100 { transition-delay: 100ms; } 
        .delay-200 { transition-delay: 200ms; } 
        .delay-300 { transition-delay: 300ms; } 
        .delay-400 { transition-delay: 400ms; }
        
        .bg-0 { background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%); }
        .bg-1 { background: radial-gradient(circle at center, #064e3b 0%, #0f172a 100%); }
        .bg-2 { background: radial-gradient(circle at center, #701a75 0%, #0f172a 100%); }
        .bg-3 { background: radial-gradient(circle at center, #7c2d12 0%, #0f172a 100%); }
        .bg-4 { background: radial-gradient(circle at center, #581c87 0%, #0f172a 100%); }
        .bg-5 { background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%); }
    </style>
</head>
<body>
    <main id="scroller"></main>

    <!-- ייבוא קובץ הנתונים החיצוני -->
    <script src="data.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scroller = document.getElementById('scroller');
            
            // בדיקה שקובץ הנתונים אכן נטען
            if (typeof projectsData === 'undefined') {
                scroller.innerHTML = '<div style="display:flex; justify-content:center; align-items:center; height:100vh; color:#ff4d4d; font-size:24px;">שגיאה: לא הצלחתי למצוא את קובץ הנתונים data.js באותה תיקייה.</div>';
                return;
            }

            // יצירת הכרטיסיות
            projectsData.forEach((project, index) => {
                const bgClass = `bg-${index % 6}`; 
                const section = document.createElement('section');
                section.className = bgClass;
                
                section.innerHTML = `
                    <div class="project-card">
                        <div class="iframe-wrapper animate-up delay-100">
                            <iframe src="${project.url}" loading="lazy"></iframe>
                        </div>
                        <h2 class="text-4xl font-bold mb-2 animate-up delay-200">${project.title}</h2>
                        <p class="text-lg text-gray-300 mb-6 animate-up delay-300">${project.description}</p>
                        <div class="animate-up delay-400">
                            <a href="${project.url}" target="_blank" class="inline-block px-8 py-2 bg-white text-black font-semibold rounded-full hover:bg-gray-200 transition-colors">
                                לפתיחת הפרויקט
                            </a>
                        </div>
                    </div>
                `;
                scroller.appendChild(section);
            });

            // הפעלת האנימציות
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    } else {
                        entry.target.classList.remove('is-visible');
                    }
                });
            }, { threshold: 0.3 });

            setTimeout(() => {
                document.querySelectorAll('section').forEach(sec => observer.observe(sec));
            }, 50);
        });
    </script>
</body>
</html>
