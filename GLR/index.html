<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפרויקטים של מאיר</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* כאן נשאר כל ה-CSS מהדוגמה הקודמת */
    </style>
</head>
<body>
    <main id="scroller"></main>

    <!-- ייבוא קובץ הנתונים החיצוני -->
    <script src="data.js"></script>

    <script>
        // ברגע שהדף עולה, הוא לוקח את projectsData מקובץ ה-data.js ובונה את האתר
        document.addEventListener('DOMContentLoaded', () => {
            const scroller = document.getElementById('scroller');
            
            projectsData.forEach((project, index) => {
                const bgClass = `bg-${index % 6}`; 
                const section = document.createElement('section');
                section.className = bgClass;
                
                section.innerHTML = `
                    <div class="project-card">
                        <div class="iframe-wrapper animate-up delay-100">
                            <iframe src="${project.url}" loading="lazy"></iframe>
                        </div>
                        <h2 class="text-4xl font-bold mb-2 animate-up delay-200">${project.title}</h2>
                        <p class="text-lg text-gray-300 mb-6 animate-up delay-300">${project.description}</p>
                        <div class="animate-up delay-400">
                            <a href="${project.url}" target="_blank" class="inline-block px-8 py-2 bg-white text-black font-semibold rounded-full hover:bg-gray-200 transition-colors">
                                לפתיחת הפרויקט
                            </a>
                        </div>
                    </div>
                `;
                scroller.appendChild(section);
            });

            // מנגנון האנימציה (Intersection Observer)
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    } else {
                        entry.target.classList.remove('is-visible');
                    }
                });
            }, { threshold: 0.3 });

            // שימוש קטן כדי לחכות שהאלמנטים יוצרו לפני המעקב
            setTimeout(() => {
                document.querySelectorAll('section').forEach(sec => observer.observe(sec));
            }, 50);
        });
    </script>
</body>
</html>
